# Self-hosted private spaces. No user-facing runner setup or workspace sharing.
services:
  platform:
    environment:
      MANAGED_EXECUTORS: "true"
      PRIVATE_USER_SPACES: "true"
      OPENCODE_ADMIN_URL: http://opencode-admin:4970
      MANAGED_CAPACITY: ${MANAGED_CAPACITY:-2}
    depends_on:
      opencode-admin: { condition: service_started }
  opencode-admin:
    image: ${MANAGED_EXECUTOR_IMAGE:-openresearch-managed-executor:hosted}
    command: [opencode, serve, --pure, --hostname, 0.0.0.0, --port, "4970"]
    environment:
      HOME: /tmp/opencode-admin
      XDG_CONFIG_HOME: /run/orx-config
      XDG_DATA_HOME: /tmp/opencode-admin/data
      XDG_STATE_HOME: /tmp/opencode-admin/state
      XDG_CACHE_HOME: /tmp/opencode-admin/cache
      OPENCODE_CONFIG_PROJECT_DISABLE: "1"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
    volumes:
      - ${MANAGED_OPENCODE_CONFIG_DIRECTORY:-/srv/openresearch/config}:/run/orx-config/opencode
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  provisioner:
    build:
      context: ../..
      dockerfile: packages/platform/Dockerfile
    user: "0:0"
    command: [node, src/provisioner.mjs]
    environment:
      DATABASE_URL: postgres://research_platform:${PLATFORM_DB_PASSWORD}@db:5432/research_platform
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN}
      MANAGED_CONNECT_URL: ${PLATFORM_ORIGIN}
      MANAGED_EXECUTOR_IMAGE: ${MANAGED_EXECUTOR_IMAGE:-openresearch-managed-executor:hosted}
      MANAGED_EXECUTOR_MEMORY: ${MANAGED_EXECUTOR_MEMORY:-2684354560}
      MANAGED_EXECUTOR_MEMORY_SWAP: ${MANAGED_EXECUTOR_MEMORY_SWAP:-4831838208}
      MANAGED_OPENCODE_LIVE_CONFIG_DIR: ${MANAGED_OPENCODE_CONFIG_DIRECTORY:-/srv/openresearch/config}
      ORX_DEEP_LITERATURE_URL: ${DEEPLIT_ORIGIN:?Set HTTPS Deep Literature origin}
      ORX_DEEP_LITERATURE_WEB_URL: ${DEEPLIT_ORIGIN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
    init: true
    read_only: true
    restart: unless-stopped
