# Dedicated MobileSci entry. Other server blocks remain untouched.
map $http_upgrade $mobilesci_connection_upgrade {
    default upgrade;
    '' close;
}
map "$request_method:$http_origin" $mobilesci_csrf_allowed {
    default 0;
    ~^(GET|HEAD):$ 1;
    "GET:http://61.136.101.179:20281" 1;
    "HEAD:http://61.136.101.179:20281" 1;
    "POST:http://61.136.101.179:20281" 1;
    "PUT:http://61.136.101.179:20281" 1;
    "PATCH:http://61.136.101.179:20281" 1;
    "DELETE:http://61.136.101.179:20281" 1;
}
server {
    listen 20281;
    server_name 61.136.101.179 localhost;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host 61.136.101.179:20281;
    proxy_set_header X-Forwarded-Host 61.136.101.179:20281;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mobilesci_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location = /_mobilesci_auth {
        internal;
        proxy_pass http://127.0.0.1:5300/api/platform/browser-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 61.136.101.179:20281;
        proxy_set_header Origin http://61.136.101.179:20281;
    }
    location = /_account/login { proxy_pass http://127.0.0.1:5300/; }
    location ~ ^/(api/platform/|api/auth/sso/|platform\.js$|platform\.css$|healthz$) {
        proxy_pass http://127.0.0.1:5300;
    }
    # SSO needs a login page while retaining its signed continuation.
    location = / {
        if ($arg_continue != "") { return 302 /_account/login$is_args$args; }
        return 302 /mobilesci/;
    }
    location = /deepxiv { return 308 /deepxiv/$is_args$args; }
    location /deepxiv/ { proxy_pass http://127.0.0.1:3005; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:3005; }
    location = /mobilesci { return 308 /mobilesci/; }
    location ~ ^/mobilesci/api/(internal/|remote/|update|settings/data-dir) { return 404; }
    location /mobilesci/api/ {
        if ($mobilesci_csrf_allowed = 0) { return 403; }
        auth_request /_mobilesci_auth;
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791/api/;
    }
    location /mobilesci/ {
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791/;
    }
    location = /_orx/runtime {
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791;
    }
    location = /api/health {
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791;
    }
    location ~ ^/api/(internal/|remote/|update|settings/data-dir) { return 404; }
    # These three endpoints belong to MobileSci, before DeepXiv's /api/papers/:id.
    location ~ ^/api/papers/(search|discover|resolve)$ {
        if ($mobilesci_csrf_allowed = 0) { return 403; }
        auth_request /_mobilesci_auth;
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791;
    }
    location ~ ^/(_next/|abs/|library(?:/|$)|account(?:/|$)|blog(?:/|$)|researchers(?:/|$)|papers/|api/(papers(?:/|$)|auth/(openresearch/|login$|register$|me$|logout$)|notes(?:/|$)|library(?:/|$)|comments(?:/|$)|researchers(?:/|$)|serve-pdf/|chat$)) {
        proxy_pass http://127.0.0.1:3005;
    }
    location /api/ {
        if ($mobilesci_csrf_allowed = 0) { return 403; }
        auth_request /_mobilesci_auth;
        proxy_set_header Host localhost:4791;
        proxy_set_header Origin http://localhost:4791;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mobilesci_connection_upgrade;
        proxy_pass http://127.0.0.1:4791;
    }
    location / { return 404; }
}
